<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paint Runner Stats</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
  <style>
    :root {
      --bg: #efece4; --surface: #ffffff; --surface-2: #f7f5ef; --ink: #1c1c1f; --ink-2: #55555c; --ink-3: #8a8a92;
      --line: #dcd8cc; --grid: #ece9e1; --bar: #2f7bff; --bar-2: #1fc160; --bar-hover: #1a4fb8; --accent: #e8a400;
      --good: #138a4b; --bad: #c42b3a; --chip: #f2efe6;
      --font: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141418; --surface: #1e1e24; --surface-2: #24242b; --ink: #f1efe9; --ink-2: #b4b2ad; --ink-3: #85838d;
        --line: #34343c; --grid: #2a2a31; --bar: #5b97ff; --bar-2: #3ed883; --bar-hover: #8db6ff; --accent: #ffc93c;
        --good: #5fd394; --bad: #ff7a85; --chip: #2a2a31;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
    header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 14px clamp(16px, 4vw, 40px); border-bottom: 2px solid var(--line); background: var(--surface);
      position: sticky; top: 0; z-index: 3;
    }
    header h1 { margin: 0; font-size: 20px; margin-right: auto; }
    header a { color: var(--ink-2); }
    main { padding: 20px clamp(16px, 4vw, 40px) 60px; max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
    .btn {
      font: 700 13px var(--font); border: 2px solid var(--ink); border-radius: 999px; background: var(--surface);
      color: var(--ink); padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn:focus-visible, summary:focus-visible, th button:focus-visible, .range button:focus-visible, input:focus-visible { outline: 3px solid var(--bar); outline-offset: 2px; }
    .range { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
    .range button { font: 700 13px var(--font); border: 0; background: var(--surface); color: var(--ink); padding: 5px 12px; cursor: pointer; }
    .range button + button { border-left: 2px solid var(--ink); }
    .range button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
    .chip { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
    .avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: var(--line); vertical-align: middle; flex: none; display: inline-block; }

    /* collapsible panes */
    details.pane { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; }
    details.pane > summary {
      list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    }
    details.pane > summary::-webkit-details-marker { display: none; }
    details.pane > summary::before {
      content: '▸'; display: inline-block; transition: transform 0.15s; color: var(--ink-3); width: 12px;
    }
    details.pane[open] > summary::before { transform: rotate(90deg); }
    details.pane > summary h2 { margin: 0; font-size: 17px; }
    details.pane > summary .sub { color: var(--ink-2); font-size: 13px; }
    .pane-body { padding: 0 16px 16px; display: grid; gap: 14px; min-width: 0; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .kpi { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .kpi .v { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .kpi .l { color: var(--ink-2); font-size: 12.5px; }
    .kpi .d { color: var(--ink-3); font-size: 12px; }

    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
    .chart h3 { margin: 0 0 6px; font-size: 14px; }
    .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
    .chart .axis { fill: var(--ink-3); font-size: 17px; font-family: var(--font); }
    .chart .gridline { stroke: var(--grid); stroke-width: 1; }
    .chart .bar { fill: var(--bar); }
    .chart.green .bar { fill: var(--bar-2); }
    .chart g:hover .bar { fill: var(--bar-hover); }
    .chart .hit { fill: transparent; }

    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .tag { font-size: 11px; font-weight: 700; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
    .toolbar input {
      font: 14px var(--font); padding: 6px 10px; border: 2px solid var(--line); border-radius: 10px;
      background: var(--surface); color: var(--ink); min-width: 0; width: min(280px, 100%);
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
    th { font-size: 11.5px; color: var(--ink-2); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
    th button .arrow { color: var(--ink-3); font-size: 10px; }
    td.num, th.num { text-align: right; }
    th.num button { justify-content: flex-end; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: var(--surface-2); }
    tr.detail td { background: var(--surface-2); white-space: normal; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; padding: 6px 2px; }
    .detail-grid h4 { margin: 0 0 6px; font-size: 13px; }
    .mini td, .mini th { padding: 4px 6px; font-size: 13px; }
    .muted { color: var(--ink-3); }
    .stars { color: var(--accent); }
    .empty, .msg { color: var(--ink-2); padding: 20px 0; text-align: center; }
    .note { color: var(--ink-2); font-size: 13px; margin: 0; }

    .funnel { display: grid; grid-template-columns: minmax(120px, 210px) 1fr; gap: 5px 12px; align-items: center; }
    .funnel .name { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .funnel .track { position: relative; height: 16px; background: linear-gradient(to right, var(--grid) 1px, transparent 1px) 0 0 / 25% 100%; }
    .funnel .bar { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
    .funnel .row { display: contents; }
    .funnel .row:hover .bar { background: var(--bar-hover); }
    .funnel .val { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11.5px; font-weight: 700; color: var(--ink); padding-left: 6px; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 14px; color: var(--ink-2); font-size: 13px; flex-wrap: wrap; }
    #tip {
      position: fixed; pointer-events: none; z-index: 5; background: var(--ink); color: var(--bg);
      font-size: 12.5px; padding: 6px 10px; border-radius: 8px; opacity: 0; transition: opacity 0.08s; white-space: nowrap;
    }
    @media (prefers-reduced-motion: reduce) { details.pane > summary::before { transition: none; } }
  </style>
</head>
<body>
  <header>
    <h1>🎨 Paint Runner · Stats</h1>
    <div class="range" role="group" aria-label="Time range" id="range"></div>
    <button class="btn" id="refresh" title="Load the latest data">↻ Refresh</button>
    <span id="who"></span>
    <a href="./">Back to the game</a>
  </header>
  <main id="app"><p class="msg">Loading…</p></main>
  <div id="tip" role="tooltip"></div>
  <script src="vendor/firebase-app-compat.js"></script>
  <script src="vendor/firebase-auth-compat.js"></script>
  <script src="vendor/firebase-firestore-compat.js"></script>
  <script src="config.js?v=56"></script>
  <script src="cloud.js?v=56"></script>
  <script src="levels.js?v=56"></script>
  <script src="stats.js?v=56"></script>
</body>
</html>
